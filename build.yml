name: build-exe
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", architecture: x64 }
      - run: python -m pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --noconsole --name "TikTok 60FPS Patch" --icon app.ico --add-data "app.ico;." --add-data "app_icon.png;." --collect-all tkinterdnd2 main.py
      - uses: actions/upload-artifact@v4
        with: { name: TikTok-60FPS-Patch-exe, path: "dist/*.exe" }
